<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Album - AI Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Photo Album</h1>
            <p>Search photos using natural language or upload new photos</p>
        </header>

        <main>
            <!-- Search Section -->
            <section class="search-section">
                <h2>Search Photos</h2>
                <div class="search-box">
                    <input
                        type="text"
                        id="search-input"
                        placeholder="Search for photos (e.g., 'show me dogs', 'cats and birds', 'sunset')"
                    >
                    <button id="search-btn">Search</button>
                </div>
                <div id="search-results" class="results-container"></div>
            </section>

            <!-- Upload Section -->
            <section class="upload-section">
                <h2>Upload Photo</h2>
                <div class="upload-box">
                    <input type="file" id="file-input" accept="image/*">
                    <div class="custom-labels-input">
                        <label for="custom-labels">Custom Labels (comma-separated):</label>
                        <input
                            type="text"
                            id="custom-labels"
                            placeholder="e.g., John, Vacation, Beach"
                        >
                    </div>
                    <button id="upload-btn">Upload Photo</button>
                </div>
                <div id="upload-status" class="status-message"></div>
            </section>
        </main>

        <footer>
            <p>Cloud Computing Assignment 3 - Photo Album with AI Search</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
